name: Run pre-commit hooks

# Driven by ci.yml.
on:
  workflow_call:

# Pinned, else this inherits ci.yml's ceiling (the union of all its callees).
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install the project
      env:
        # Only this step can read the PAT; later uv calls use the synced venv.
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BITGEN_TOKEN }}@github.com/FPGA-Research/FABulous-bit-gen-OWAS.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/FPGA-Research/FABulous-bit-gen-OWAS
      run: |
        echo "UV_SYSTEM_PYTHON=1" >> $GITHUB_ENV
        uv sync --locked

    - name: run pre-commit
      run: |
        uv run pre-commit install
        SKIP=no-commit-to-branch uv run pre-commit run --show-diff-on-failure --color=always --all-files
